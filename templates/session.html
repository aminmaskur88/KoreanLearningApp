{% extends "base.html" %}

{% block content %}
<div id="session-wrapper" class="session-wrapper">
    <!-- Progress Bar -->
    <div class="session-header">
        <a href="{{ url_for('views.dashboard') }}" class="close-session"><i class="fas fa-times"></i></a>
        <div class="progress-container">
            <div id="session-progress" class="progress-fill" style="width: 0%;"></div>
        </div>
        <div class="hearts">
            <i class="fas fa-heart"></i> 5
        </div>
    </div>

    <!-- Active Card Area -->
    <div id="active-card" class="active-card animate-fade">
        <!-- Content will be injected by JS -->
    </div>

    <!-- Footer Action -->
    <div id="session-footer" class="session-footer">
        <div class="feedback-info" style="display: none;">
            <div class="feedback-icon-container">
                <i id="status-icon" class="fas"></i>
            </div>
            <div class="feedback-text">
                <h3 id="status-title">Bagus!</h3>
                <p id="status-msg">Jawaban benar.</p>
            </div>
        </div>
        <button id="main-action-btn" class="btn btn-primary" onclick="handleAction()">Lanjut</button>
    </div>
</div>

<style>
/* Full screen session style */
body { overflow: hidden; }
header, .bottom-nav { display: none; }
main { padding: 0; max-width: 100%; height: 100vh; }

.session-wrapper {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 20px;
    max-width: 600px;
    margin: 0 auto;
}

.session-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 30px;
}

.close-session { color: var(--text-muted); font-size: 1.5rem; text-decoration: none; }

.progress-container {
    flex: 1;
    background: var(--border);
    height: 16px;
    border-radius: 8px;
    overflow: hidden;
}

.progress-fill {
    background: var(--primary);
    height: 100%;
    transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.hearts {
    color: var(--danger);
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 5px;
}

.active-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* Question Types */
.question-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 30px; text-align: left; }

/* Intro Card (New Word) */
.intro-card { text-align: center; }
.intro-word { font-size: 4rem; color: var(--primary); font-weight: 900; margin-bottom: 10px; }
.intro-word.clickable { cursor: pointer; text-decoration: underline dotted var(--border); }
.intro-word.clickable:active { color: var(--primary-dark); }

.hint-wrapper {
    position: relative;
    display: inline-block;
    width: 100%;
    margin-bottom: 20px;
    text-align: center;
}

.hint-bubble {
    background: var(--card-bg);
    border: 2px solid var(--border);
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 0.85rem;
    font-weight: bold;
    color: var(--text-muted);
    display: inline-block;
    margin-bottom: 10px;
    position: relative;
    box-shadow: 0 2px 0 0 var(--border);
    transition: all 0.2s;
}

.hint-bubble.active {
    background: var(--secondary);
    border-color: var(--secondary-dark);
    color: white;
    box-shadow: 0 2px 0 0 var(--secondary-dark);
}

.hint-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid var(--border);
}

.hint-bubble.active::after {
    border-top-color: var(--secondary-dark);
}

/* Choice Card */
.options-stack { display: flex; flex-direction: column; gap: 12px; }
.option-btn {
    background: white;
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
    box-shadow: 0 4px 0 0 var(--border);
    transition: transform 0.1s;
}
.option-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 0 var(--border); }
.option-btn.selected { border-color: var(--secondary); background-color: #e5f5ff; color: var(--secondary); box-shadow: 0 4px 0 0 #1899d6; }

/* Listening & Typing */
.listening-box {
    width: 120px;
    height: 120px;
    background: var(--secondary);
    color: white;
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 40px auto;
    font-size: 3rem;
    box-shadow: 0 6px 0 0 var(--secondary-dark);
    cursor: pointer;
    transition: transform 0.1s;
}
.listening-box:active { transform: translateY(3px); box-shadow: 0 3px 0 0 var(--secondary-dark); }

.typing-input {
    width: 100%;
    padding: 20px;
    font-size: 1.2rem;
    font-weight: bold;
    border: 2px solid var(--border);
    border-radius: 16px;
    background: #f7f7f7;
    color: var(--text);
    outline: none;
    text-align: center;
}
.typing-input:focus { border-color: var(--secondary); background: white; }

/* Character Bank */
.writing-area {
    min-height: 80px;
    border: 2px dashed var(--border);
    background: var(--background);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
    padding: 10px;
}

.character-bank {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
}

.char-bubble {
    background: white;
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 10px 15px;
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 0 0 var(--border);
}

.char-bubble:active { transform: translateY(2px); box-shadow: none; }
.char-bubble.used { opacity: 0.3; pointer-events: none; }

/* Selected Char used in bank/writing area */
.selected-char {
    background: var(--secondary);
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

/* Assembly Visuals */
.assembly-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: 20px 0;
}

.hangul-block-frame {
    width: 120px;
    height: 120px;
    border: 3px dashed var(--border);
    border-radius: 20px;
    display: grid;
    padding: 10px;
    gap: 10px;
    background: rgba(0,0,0,0.02);
}

.horizontal-stack { grid-template-columns: 1fr 1fr; }
.vertical-stack { grid-template-rows: 1fr 1fr; }

.slot {
    background: var(--card-bg);
    border: 2px solid var(--border);
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
    font-weight: 900;
    color: var(--text-muted);
    transition: all 0.2s;
}

.slot.filled {
    color: var(--secondary);
    border-color: var(--secondary);
    background: #e5f5ff;
}

.assembly-arrow { font-size: 2rem; color: var(--border); }

.assembly-final {
    width: 100px;
    height: 100px;
    background: var(--primary);
    color: white;
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 3.5rem;
    font-weight: 900;
    box-shadow: 0 6px 0 0 var(--primary-dark);
}

/* Speaking Challenge */
.speaking-target {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    cursor: pointer;
    margin-bottom: 20px;
}
.speaking-target i { color: var(--secondary); font-size: 1.5rem; }

.mic-container {
    text-align: center;
    margin-top: 40px;
}

.mic-btn {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    border: none;
    font-size: 2.5rem;
    box-shadow: 0 6px 0 0 var(--primary-dark);
    cursor: pointer;
    transition: all 0.2s;
}

.mic-btn:active { transform: translateY(4px); box-shadow: none; }
.mic-btn.listening {
    background: var(--danger);
    box-shadow: 0 6px 0 0 var(--danger-dark);
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

.mic-status { margin-top: 15px; font-weight: bold; color: var(--text-muted); }
.recognition-result { margin-top: 20px; font-size: 1.5rem; font-weight: 800; color: var(--secondary); text-align: center; min-height: 2rem; }

/* Footer Action */
.session-footer {
    height: 140px;
    margin: 0 -20px -20px -20px;
    padding: 20px;
    border-top: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: background 0.2s;
}

.feedback-info { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
.feedback-icon-container {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5rem;
}

.session-footer.correct { background: #d7ffb8; color: #46a302; }
.session-footer.correct .feedback-icon-container { background: white; color: var(--primary); }
.session-footer.correct h3, .session-footer.correct p { color: #46a302 !important; }

.session-footer.wrong { background: #ffdfe0; color: #ea2b2b; }
.session-footer.wrong .feedback-icon-container { background: white; color: var(--danger); }
.session-footer.wrong h3, .session-footer.wrong p { color: #ea2b2b !important; }
</style>
{% endblock %}

{% block scripts %}
<script>
var category = "{{ category }}";
var steps = [];
var currentStepIdx = 0;
var isAnswered = false;
var selectedCardId = null;
var allVocabPool = [];
var hearts = 5;

async function initSession() {
    const container = document.getElementById('active-card');
    container.innerHTML = '<div class="loading-state"><i class="fas fa-spinner fa-spin"></i> Menyiapkan materi...</div>';
    
    // Reset steps
    steps = [];
    currentStepIdx = 0;

    try {
        // 1. If explicit AI Evaluation, go AI directly
        if (category === 'AI_Exam') {
            await startAISession();
            return;
        }

        // 2. Try Normal Mode (Local DB)
        const response = await fetch(`/api/vocabulary?category=${encodeURIComponent(category)}`);
        const vocab = await response.json();
        
        if (vocab.length > 0) {
            console.log("Starting Normal Session (Local DB)");
            const allRes = await fetch('/api/vocabulary');
            allVocabPool = await allRes.json();
            
            // Generate session steps from local data
            const selectedVocab = vocab.sort(() => Math.random() - 0.5).slice(0, 4);
            selectedVocab.forEach(item => {
                steps.push({ type: 'intro', data: item });
                steps.push({ type: 'listening', data: item, options: generateOptions(item) });
                if (Math.random() > 0.5) steps.push({ type: 'choice', data: item, options: generateOptions(item) });
                else steps.push({ type: 'typing', data: item });
                steps.push({ type: 'typing_ko', data: item });
                steps.push({ type: 'speaking', data: item });
            });

            // Shuffle practice
            const intros = steps.filter(s => s.type === 'intro');
            const practice = steps.filter(s => s.type !== 'intro').sort(() => Math.random() - 0.5);
            steps = [...intros, ...practice];
            
            updateHearts();
            renderStep();
        } else if (category.startsWith('Hangul')) {
            // Handle Hangul categories from DB
            await startLocalHangulSession();
        } else {
            // 3. Category empty locally? Invoke AI Tutor
            console.log("Category empty, invoking AI Tutor...");
            await startAISession();
        }
    } catch (e) {
        console.error("Session Init Error:", e);
        showAlert("Maaf", e.message, () => window.location.href = "/");
    }
}

async function startLocalHangulSession() {
    const response = await fetch('/api/hangul');
    const hangul = await response.json();
    let selected = [];
    if (category === 'Hangul_Konsonan') selected = hangul.filter(h => h.type === 'Konsonan').sort(() => Math.random() - 0.5).slice(0, 8);
    else if (category === 'Hangul_Vokal') selected = hangul.filter(h => h.type === 'Vokal').sort(() => Math.random() - 0.5).slice(0, 8);
    else selected = hangul.sort(() => Math.random() - 0.5).slice(0, 8);

    selected.forEach(item => {
        steps.push({ type: 'intro_char', data: { korean: item.char, meaning: item.name, romanization: item.romanization, example: item.pronunciation } });
        steps.push({ type: 'choice_char', data: item, question: `Pilih huruf untuk "${item.romanization}":`, options: generateHangulOptions(item, hangul) });
        steps.push({ type: 'choice_sound', data: item, question: `Apa bunyi dari "${item.char}"?`, options: generateSoundOptions(item, hangul) });
    });

    if (category === 'Hangul_Assembly' || category === 'Hangul') {
        const consonants = hangul.filter(h => h.type === 'Konsonan');
        const vowels = hangul.filter(h => h.type === 'Vokal');
        for (let i = 0; i < 4; i++) {
            const c = consonants[Math.floor(Math.random() * consonants.length)];
            const v = vowels[Math.floor(Math.random() * vowels.length)];
            steps.push({ type: 'assemble_hangul', data: { result: combine(c.char, v.char), parts: [c.char, v.char], roman: c.romanization.split('/')[0] + v.romanization } });
        }
    }

    const intros = steps.filter(s => s.type.startsWith('intro'));
    const practice = steps.filter(s => !s.type.startsWith('intro')).sort(() => Math.random() - 0.5);
    steps = [...intros, ...practice];
    updateHearts();
    renderStep();
}

async function startAISession() {
    const currRes = await fetch('/api/curriculum');
    const currData = await currRes.json();
    let levelLabel = "TOPIK I";
    currData.sections.forEach(s => {
        if (s.units.find(u => u.category === category)) levelLabel = s.level;
    });

    const aiUrl = `/api/generate_ai_session?category=${encodeURIComponent(category)}&level=${encodeURIComponent(levelLabel)}`;
    const response = await fetch(aiUrl);
    if (!response.ok) throw new Error("Gagal terhubung ke tutor AI.");
    
    const aiData = await response.json();
    const questions = Array.isArray(aiData) ? aiData : aiData.questions || [];
    if (questions.length === 0) throw new Error("AI tidak menghasilkan materi.");

    questions.forEach(q => {
        let stepType = q.type;
        if (q.type === 'typing' && q.direction === 'id_to_ko') stepType = 'typing_ko';
        if (q.type === 'speaking') q.direction = 'ko_to_id'; 
        steps.push({
            type: stepType,
            direction: q.direction,
            data: { korean: q.target, meaning: q.answer, id: q.answer, example: `AI Tutor: ${levelLabel}`, romanization: q.romanization || "" },
            question: q.question,
            options: q.options ? q.options.map(o => ({ meaning: o, id: o })) : []
        });
    });

    updateHearts();
    renderStep();
}

function generateHangulOptions(correct, all) {
    let opts = [correct];
    while (opts.length < 4) {
        let rand = all[Math.floor(Math.random() * all.length)];
        if (!opts.find(o => o.char === rand.char)) opts.push(rand);
    }
    return opts.sort(() => Math.random() - 0.5);
}

function generateSoundOptions(correct, all) {
    let opts = [correct];
    while (opts.length < 4) {
        let rand = all[Math.floor(Math.random() * all.length)];
        if (!opts.find(o => o.romanization === rand.romanization)) opts.push(rand);
    }
    return opts.sort(() => Math.random() - 0.5);
}

function combine(c, v) {
    const initials = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
    const medials = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
    
    const iIdx = initials.indexOf(c);
    const mIdx = medials.indexOf(v);
    
    if (iIdx !== -1 && mIdx !== -1) {
        // Hangul Syllable Code Point = ((initial * 21) + medial) * 28 + final + 0xAC00
        // For basic CV, final is 0
        const charCode = ((iIdx * 21) + mIdx) * 28 + 0xAC00;
        return String.fromCharCode(charCode);
    }
    return c + v;
}

function generateOptions(correctItem) {
    let opts = [correctItem];
    let distractorPool = allVocabPool.filter(v => v.id !== correctItem.id);
    let distractors = distractorPool.sort(() => Math.random() - 0.5).slice(0, 3);
    opts = opts.concat(distractors);
    return opts.sort(() => Math.random() - 0.5);
}

function renderStep() {
    isAnswered = false;
    selectedCardId = null;
    if (steps.length === 0 || currentStepIdx >= steps.length) {
        showAlert("Error", "Gagal memuat langkah soal.");
        window.location.href = "/";
        return;
    }
    
    const step = steps[currentStepIdx];
    if (!step || !step.data) {
        console.error("Step data missing:", step);
        currentStepIdx++;
        renderStep();
        return;
    }

    const container = document.getElementById('active-card');
    const footer = document.getElementById('session-footer');
    const btn = document.getElementById('main-action-btn');
    const feedback = document.querySelector('.feedback-info');
    
    // Reset UI
    footer.className = 'session-footer';
    feedback.style.display = 'none';
    btn.textContent = step.type === 'intro' ? 'Mengerti' : 'Periksa';
    btn.className = 'btn btn-primary';
    
    container.innerHTML = '';
    container.className = 'active-card animate-fade';
    
    if (step.type === 'intro' || step.type === 'intro_char') {
        speak(step.data.korean);
        container.innerHTML = `
            <div class="intro-card">
                <p class="question-title">${step.type === 'intro_char' ? 'Huruf Baru!' : 'Kata Baru!'}</p>
                <div class="hint-wrapper">
                    <h1 class="intro-word clickable" onclick="toggleHint(this, '${step.data.romanization}')">${step.data.korean}</h1>
                    <div class="hint-bubble" id="hint-bubble">Ketuk untuk cara baca</div>
                </div>
                <div class="card intro-meaning-card">
                    <p class="intro-meaning">${step.data.meaning}</p>
                </div>
                <p style="margin-top: 20px; font-size: 0.9rem;" class="session-example">
                    "${step.data.example}"
                </p>
            </div>
        `;
    } else if (step.type === 'choice' || step.type === 'choice_char') {
        // Only show hint if the target word is Korean
        const showHint = step.type !== 'choice_char' && (step.direction !== 'id_to_ko');
        
        container.innerHTML = `
            <p class="question-title">${step.question || 'Pilih arti yang benar:'}</p>
            ${showHint ? `
                <div class="hint-wrapper">
                    <h1 class="intro-word clickable" onclick="toggleHint(this, '${step.data.romanization}')" style="font-size: 3rem;">${step.data.korean}</h1>
                    <div class="hint-bubble" id="hint-bubble">Ketuk untuk cara baca</div>
                </div>
            ` : `
                <h1 class="intro-word" style="font-size: 3rem; margin-bottom:20px;">${step.data.korean}</h1>
            `}
            <div class="options-stack">
                ${step.options.map(opt => `
                    <button class="option-btn" onclick="selectOption('${step.type === 'choice_char' ? opt.char : opt.id}', this)">
                        ${step.type === 'choice_char' ? opt.char : opt.meaning}
                    </button>
                `).join('')}
            </div>
        `;
    } else if (step.type === 'choice_sound') {
        container.innerHTML = `
            <p class="question-title">${step.question}</p>
            <h1 class="intro-word" style="font-size: 4rem; margin-bottom: 20px;">${step.data.char}</h1>
            <div class="options-stack">
                ${step.options.map(opt => `
                    <button class="option-btn" onclick="selectOption('${opt.romanization}', this)">
                        ${opt.romanization}
                    </button>
                `).join('')}
            </div>
        `;
    } else if (step.type === 'assemble_hangul') {
        currentWritten = new Array(step.data.parts.length).fill(null);
        // Determine layout based on vowel
        const vowel = step.data.parts[1];
        const isHorizontal = ['ㅗ', 'ㅛ', 'ㅜ', 'ㅠ', 'ㅡ'].includes(vowel);
        
        container.innerHTML = `
            <p class="question-title">Susun bunyi "${step.data.roman}":</p>
            <div class="assembly-wrapper">
                <div class="hangul-block-frame ${isHorizontal ? 'vertical-stack' : 'horizontal-stack'}">
                    ${step.data.parts.map((_, i) => `
                        <div class="slot" id="slot-${i}" onclick="removeCharFromAssembly(${i})">?</div>
                    `).join('')}
                </div>
                <div class="assembly-arrow"><i class="fas fa-arrow-right"></i></div>
                <div class="assembly-final" id="assembly-result">?</div>
            </div>
            
            <div class="character-bank" style="margin-top: 40px;">
                ${step.data.parts.sort(() => Math.random() - 0.5).map(char => `
                    <button class="char-bubble" onclick="addCharToAssembly('${char}', this)">${char}</button>
                `).join('')}
            </div>
        `;
    }
 else if (step.type === 'listening') {
        speak(step.data.korean);
        container.innerHTML = `
            <p class="question-title">Dengar dan pilih arti yang benar:</p>
            <div class="listening-box" onclick="speak('${step.data.korean}')">
                <i class="fas fa-volume-up"></i>
            </div>
            <div class="options-stack">
                ${step.options.map(opt => `
                    <button class="option-btn" onclick="selectOption('${opt.id}', this)">
                        ${opt.meaning}
                    </button>
                `).join('')}
            </div>
        `;
    } else if (step.type === 'typing') {
        const isAI = !!step.direction;
        const promptWord = isAI ? step.data.korean : step.data.korean; // AI target is prompt
        
        container.innerHTML = `
            <p class="question-title">${step.question || 'Tulis arti kata ini:'}</p>
            <h1 class="intro-word" style="font-size: 3.5rem; margin-bottom: 40px;">${step.data.korean}</h1>
            <input type="text" id="typing-input" class="typing-input" placeholder="Ketik di sini..." autocomplete="off">
        `;
        setTimeout(() => document.getElementById('typing-input').focus(), 100);
    } else if (step.type === 'typing_ko') {
        currentWritten = []; // Reset writing area
        const isAI = !!step.direction;
        
        // Logical Mapping: 
        // AI id_to_ko: korean="Halo", meaning="안녕하세요"
        // Local: korean="안녕하세요", meaning="Halo"
        const targetHangul = isAI ? step.data.meaning : step.data.korean;
        const promptWord = isAI ? step.data.korean : step.data.meaning;
        
        const syllables = targetHangul.split('');
        let bank = [...syllables];
        const decoys = ['은', '는', '이', '가', '을', '를', '요', '다', '합', '니'];
        while(bank.length < 8) {
            let d = decoys[Math.floor(Math.random() * decoys.length)];
            if(!bank.includes(d)) bank.push(d);
        }
        bank = bank.sort(() => Math.random() - 0.5);

        container.innerHTML = `
            <p class="question-title">${step.question || 'Susun dalam Bahasa Korea:'}</p>
            <h2 class="intro-meaning" style="margin-bottom: 30px; color: var(--secondary); font-size: 2.5rem;">${promptWord}</h2>
            <div id="writing-area" class="writing-area card"></div>
            <div class="character-bank">
                ${bank.map(char => `<button class="char-bubble" onclick="addChar('${char}', this)">${char}</button>`).join('')}
            </div>
            <button class="btn-secondary" style="margin-top: 10px; border:none; background:none; font-size: 0.8rem;" onclick="clearWriting()">Hapus Semua</button>
        `;
    }
 else if (step.type === 'speaking') {
        container.innerHTML = `
            <p class="question-title">Ucapkan kata ini:</p>
            <div class="speaking-target" onclick="speak('${step.data.korean}')">
                <i class="fas fa-volume-up"></i>
                <h1 class="intro-word">${step.data.korean}</h1>
            </div>
            
            <div class="mic-container">
                <button id="mic-btn" class="mic-btn" onclick="startListening()">
                    <i class="fas fa-microphone"></i>
                </button>
                <p id="mic-status" class="mic-status">Ketuk mikrofon untuk bicara</p>
            </div>
            
            <div id="recognition-result" class="recognition-result"></div>
        `;
    }
    
    // Update progress
    document.getElementById('session-progress').style.width = `${(currentStepIdx / steps.length) * 100}%`;
}

function selectOption(id, btn) {
    if (isAnswered) return;
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedCardId = id;
}

function toggleHint(el, roman) {
    const bubble = document.getElementById('hint-bubble');
    if (bubble.classList.contains('active')) {
        bubble.classList.remove('active');
        bubble.textContent = 'Ketuk untuk cara baca';
    } else {
        bubble.classList.add('active');
        bubble.textContent = roman;
        speak(el.textContent);
    }
}

let currentWritten = [];

function addChar(char, btn) {
    currentWritten.push(char);
    btn.classList.add('used');
    renderWriting();
}

function removeChar(idx, char) {
    currentWritten.splice(idx, 1);
    // Find the bubble and restore it
    const bubbles = document.querySelectorAll('.char-bubble');
    for (let b of bubbles) {
        if (b.textContent === char && b.classList.contains('used')) {
            b.classList.remove('used');
            break;
        }
    }
    renderWriting();
}

function clearWriting() {
    currentWritten = [];
    document.querySelectorAll('.char-bubble').forEach(b => b.classList.remove('used'));
    renderWriting();
}

function renderWriting() {
    const area = document.getElementById('writing-area');
    area.innerHTML = currentWritten.map((c, i) => 
        `<button class="selected-char animate-fade" onclick="removeChar(${i}, '${c}')">${c}</button>`
    ).join('');
}

let recognition;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'ko-KR';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
}

function startListening() {
    if (!recognition) {
        showAlert('Info', 'Browser Anda tidak mendukung pengenalan suara.');
        return;
    }

    const btn = document.getElementById('mic-btn');
    const status = document.getElementById('mic-status');
    const resultDiv = document.getElementById('recognition-result');

    try {
        recognition.start();
        btn.classList.add('listening');
        status.textContent = 'Mendengarkan...';
    } catch (e) {
        console.error(e);
    }

    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        resultDiv.textContent = transcript;
        btn.classList.remove('listening');
        status.textContent = 'Selesai mendengarkan';

        const step = steps[currentStepIdx];
        // Clean transcript and target for comparison (remove spaces/punct)
        const cleanT = transcript.replace(/\s/g, '');
        const cleanTarget = step.data.korean.replace(/\s/g, '');

        if (cleanT === cleanTarget) {
            handleAction(true); // Force correct
        } else {
            status.textContent = 'Kurang tepat, coba lagi?';
        }
    };

    recognition.onerror = () => {
        btn.classList.remove('listening');
        status.textContent = 'Error akses mikrofon.';
    };

    recognition.onend = () => {
        btn.classList.remove('listening');
    };
}

function updateHearts() {
    const heartEl = document.querySelector('.hearts');
    heartEl.innerHTML = `<i class="fas fa-heart"></i> ${hearts}`;
    if (hearts <= 2) heartEl.style.color = 'var(--danger)';
}

function addCharToAssembly(char, btn) {
    if (isAnswered) return;
    
    // Find first empty slot
    const idx = currentWritten.indexOf(null);
    
    if (idx !== -1) {
        currentWritten[idx] = char;
        btn.classList.add('used');
        btn.dataset.slotRef = idx; // Mark which slot this button filled
        
        const slot = document.getElementById(`slot-${idx}`);
        if (slot) {
            slot.textContent = char;
            slot.classList.add('filled');
        }
        
        // If all slots filled, show result
        if (currentWritten.every(val => val !== null)) {
            const result = combine(currentWritten[0], currentWritten[1]);
            document.getElementById('assembly-result').textContent = result;
            speak(result);
        }
    }
}

function removeCharFromAssembly(idx) {
    if (isAnswered) return;
    const char = currentWritten[idx];
    if (!char) return;

    // Clear slot
    const slot = document.getElementById(`slot-${idx}`);
    slot.textContent = "?";
    slot.classList.remove('filled');
    currentWritten[idx] = null;

    // Restore button in bank
    const buttons = document.querySelectorAll('.char-bubble.used');
    for (let b of buttons) {
        if (b.textContent === char && b.dataset.slotRef == idx) {
            b.classList.remove('used');
            delete b.dataset.slotRef;
            break;
        }
    }

    // Clear result
    document.getElementById('assembly-result').textContent = "?";
}

function handleAction(forceCorrect = false) {
    const step = steps[currentStepIdx];
    const footer = document.getElementById('session-footer');
    const btn = document.getElementById('main-action-btn');
    const feedback = document.querySelector('.feedback-info');
    
    if (step.type === 'intro' || step.type === 'intro_char') {
        currentStepIdx++;
        if (currentStepIdx < steps.length) renderStep();
        else finishSession();
        return;
    }

    if (!isAnswered) {
        let isCorrect = forceCorrect;
        
        // Developer Mode: Auto-win
        if (localStorage.getItem('devMode') === 'true') {
            isCorrect = true;
        }

        if (!forceCorrect && !isCorrect) {
            const isAI = !!step.direction;
            if (step.type === 'typing') {
                const input = document.getElementById('typing-input').value.trim().toLowerCase();
                const correct = step.data.meaning.trim().toLowerCase();
                isCorrect = input === correct;
            } else if (step.type === 'typing_ko') {
                const input = currentWritten.join('');
                const correct = isAI ? step.data.meaning : step.data.korean;
                isCorrect = input === correct;
            } else if (step.type === 'assemble_hangul') {
                const inputResult = combine(currentWritten[0], currentWritten[1]);
                isCorrect = inputResult === step.data.result;
            } else if (step.type === 'speaking') {
                return; // Wait for voice result
            } else if (step.type === 'choice_char') {
                if (!selectedCardId) return;
                isCorrect = selectedCardId === step.data.char;
            } else if (step.type === 'choice_sound') {
                if (!selectedCardId) return;
                isCorrect = selectedCardId === step.data.romanization;
            } else {
                if (!selectedCardId) return;
                // AI Choice uses meaning as ID/Answer
                const correct = isAI ? step.data.meaning : step.data.id;
                isCorrect = selectedCardId == correct;
            }
        }
        
        isAnswered = true;
        footer.className = `session-footer ${isCorrect ? 'correct' : 'wrong'}`;
        feedback.style.display = 'flex';
        document.getElementById('status-title').textContent = isCorrect ? 'Bagus!' : 'Kurang Tepat';
        
        const isAI = !!step.direction;
        let correctVal = step.data.korean;
        let meaningVal = step.data.meaning;
        
        if (isAI) {
            correctVal = step.data.meaning; // AI answer
            meaningVal = step.data.korean;  // AI prompt
        } else {
            if (step.type === 'typing') {
                correctVal = step.data.meaning;
                meaningVal = step.data.korean;
            }
        }
        
        if (step.type === 'choice_sound') { correctVal = step.data.romanization; meaningVal = step.data.char; }
        if (step.type === 'assemble_hangul') { correctVal = step.data.result; meaningVal = step.data.roman; }

        document.getElementById('status-msg').textContent = isCorrect ? 'Jawaban Anda benar.' : `Harusnya: ${correctVal} (${meaningVal})`;
        
        document.getElementById('status-icon').className = isCorrect ? 'fas fa-check' : 'fas fa-times';
        
        if (!isCorrect) {
            hearts--;
            updateHearts();
            
            // Report mistake to AI tracking (Only for normal sessions)
            if (category !== 'AI_Exam') {
                fetch('/api/report_mistake', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        item_type: step.data.char ? 'hangul' : 'vocab', 
                        item_id: step.data.id 
                    })
                });
            }

            // Push failed step to end
            steps.push(JSON.parse(JSON.stringify(step)));
            
            if (hearts <= 0) {
                showAlert('Gagal', 'Anda kehabisan nyawa! Coba lagi nanti.', () => {
                    window.location.href = "{{ url_for('views.dashboard') }}";
                });
                return;
            }
        }
        
        btn.textContent = 'Lanjut';
    } else {
        currentStepIdx++;
        if (currentStepIdx < steps.length) renderStep();
        else finishSession();
    }
}

async function finishSession() {
    await addXP(20);
    // Mark as completed
    await fetch('/api/complete_category', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ category: category })
    });
    
    showAlert('Selamat!', 'Sesi selesai! Anda mendapatkan 20 XP.', () => {
        window.location.href = "{{ url_for('views.dashboard') }}";
    });
}

initSession();
</script>
{% endblock %}
