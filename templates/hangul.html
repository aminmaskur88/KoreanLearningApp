{% extends "base.html" %}

{% block content %}
<div class="animate-fade">
    <div class="section-header">
        <h2>Belajar Hangul</h2>
        <p>Ketuk huruf untuk mendengar cara baca</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="filterHangul('Vokal')">Vokal</button>
        <button class="tab-btn" onclick="filterHangul('Konsonan')">Konsonan</button>
    </div>

    <div id="hangul-grid" class="hangul-grid">
        <!-- Hangul items will be loaded here -->
    </div>
</div>

<div id="hangul-modal" class="modal">
    <div class="modal-content card">
        <span class="close-modal">&times;</span>
        <div class="modal-body text-center">
            <h1 id="modal-char" class="large-char">ㄱ</h1>
            <h3 id="modal-name">Giyeok</h3>
            <p id="modal-roman" class="text-muted">Romanization: g/k</p>
            <div class="pronunciation-box">
                <p id="modal-pronun">Seperti 'g' dalam 'gajah'</p>
            </div>
            <button class="btn btn-primary" onclick="speakChar()">
                <i class="fas fa-volume-up"></i> Putar Suara
            </button>
        </div>
    </div>
</div>

<style>
.section-header { margin-bottom: 20px; }
.tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.tab-btn {
    flex: 1;
    padding: 10px;
    border: 2px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}
.tab-btn.active {
    background: var(--secondary);
    color: white;
    border-color: var(--secondary);
}

.hangul-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.hangul-item {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

.hangul-item h2 { font-size: 1.8rem; }
.hangul-item span { font-size: 0.8rem; color: var(--text-muted); }

/* Modal Styles */
.modal {
    display: none;
    position: fixed;
    z-index: 2000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.large-char { font-size: 5rem; color: var(--primary); margin: 20px 0; }
.pronunciation-box {
    background: var(--border);
    padding: 15px;
    border-radius: 10px;
    margin: 20px 0;
}
.close-modal {
    position: absolute;
    right: 20px;
    top: 10px;
    font-size: 1.5rem;
    cursor: pointer;
}
.text-center { text-align: center; }
</style>
{% endblock %}

{% block scripts %}
<script>
let hangulData = [];
let currentFilter = 'Vokal';

async function loadHangul() {
    const response = await fetch('/api/hangul');
    hangulData = await response.json();
    renderHangul();
}

function renderHangul() {
    const grid = document.getElementById('hangul-grid');
    grid.innerHTML = '';
    
    const filtered = hangulData.filter(h => h.type === currentFilter);
    
    filtered.forEach(h => {
        const item = document.createElement('div');
        item.className = 'card hangul-item animate-fade';
        item.innerHTML = `
            <h2>${h.char}</h2>
            <span>${h.romanization}</span>
        `;
        item.onclick = () => showDetail(h);
        grid.appendChild(item);
    });
}

function filterHangul(type) {
    currentFilter = type;
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === type);
    });
    renderHangul();
}

let selectedChar = null;
function showDetail(h) {
    selectedChar = h;
    document.getElementById('modal-char').textContent = h.char;
    document.getElementById('modal-name').textContent = h.name;
    document.getElementById('modal-roman').textContent = `Romanization: ${h.romanization}`;
    document.getElementById('modal-pronun').textContent = h.pronunciation;
    document.getElementById('hangul-modal').style.display = 'flex';
}

function speakChar() {
    if (selectedChar) speak(selectedChar.char);
}

document.querySelector('.close-modal').onclick = () => {
    document.getElementById('hangul-modal').style.display = 'none';
};

window.onclick = (event) => {
    if (event.target == document.getElementById('hangul-modal')) {
        document.getElementById('hangul-modal').style.display = 'none';
    }
};

loadHangul();
</script>
{% endblock %}
